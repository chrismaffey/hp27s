# File: `docker-compose.yaml`
services:
  wherethefuckaremypants:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: prod
    container_name: wherethefuckaremypants
    restart: unless-stopped

    environment:
      - TZ=Pacific/Auckland
    env_file:
      - ../.env
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.${APP_NAME}-secure.rule=Host(`${APP_DOMAIN}`)  || Host(`www.${APP_DOMAIN}`)
      - traefik.http.routers.${APP_NAME}-secure.entrypoints=websecure
      - traefik.http.routers.${APP_NAME}-secure.middlewares=common@docker



networks:
  web:
    external: true