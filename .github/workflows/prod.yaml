name: Deploy
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: deploy.docker3.php.nz
          username: deploy
          key: ${{ secrets.DEPLOY_KEY }}
          script: /home/deploy/deploy.sh wherethefuckaremypants

